name = "wing-personal-assistant"
main = "src/index.ts"
compatibility_date = "2026-08-11"

[observability]
enabled = true
head_sampling_rate = 1

[triggers]
crons = ["0 0 * * *", "0 23 * * *"]

[[kv_namespaces]]
binding = "STATE"
id = "c1670557042b4c79bfe975fe00d78fc7"

[[d1_databases]]
binding = "DB"
database_name = "wing-personal-assistant"
database_id = "d3a67bee-7dbf-4375-8b2e-dd4c328b5ee3"

[[durable_objects.bindings]]
name = "PAIRING"
class_name = "PairingSession"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["PairingSession"]

[[queues.producers]]
queue = "chouseisan-calendar-sync"
binding = "CALENDAR_SYNC_QUEUE"

[[queues.consumers]]
queue = "chouseisan-calendar-sync"
max_batch_size = 1
max_retries = 5
dead_letter_queue = "chouseisan-calendar-sync-dlq"
